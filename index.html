<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang cập nhật hệ thống</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(26,86,219,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(99,102,241,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 500px;
      width: 90%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      animation: fadeUp 0.7s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: rgba(26,86,219,0.15);
      border-radius: 50%;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(26,86,219,0.3);
    }
    .gear {
      width: 40px;
      height: 40px;
      animation: spin 6s linear infinite;
      fill: #1a56db;
      filter: drop-shadow(0 0 8px rgba(26,86,219,0.6));
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
    }
    p.sub {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    p.sub strong { color: #cbd5e1; font-weight: 600; }
    .progress-wrap {
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      height: 5px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #1a56db, #6366f1);
      border-radius: 999px;
      animation: progressAnim 3s ease-in-out infinite alternate;
    }
    @keyframes progressAnim {
      from { width: 40%; }
      to   { width: 82%; }
    }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin-bottom: 1.25rem; }
    .contact-line { font-size: 0.85rem; color: #64748b; }
    .contact-line a { color: #1a56db; text-decoration: none; font-weight: 500; }
    .contact-line a:hover { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg class="gear" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-4a.484.484 0 0 0-.48.41l-.36 2.54a7.1 7.1 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.47a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.36 1.04.67 1.62.94l.36 2.54c.05.24.27.41.48.41h4c.24 0 .44-.17.47-.41l.36-2.54a7.1 7.1 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </div>
    <h1>Đang cập nhật hệ thống</h1>
    <p class="sub">
      Website hiện đang được <strong>nâng cấp lên phiên bản mới</strong>.<br />
      Chúng tôi sẽ trở lại trong thời gian sớm nhất.<br />
      Xin lỗi vì sự bất tiện này!
    </p>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
    <hr />
    <p class="contact-line">Cần hỗ trợ? Liên hệ: <a href="mailto:contact.clituspc@gmail.com">contact.clituspc@gmail.com</a></p>
  </div>

  <script>
    // Chặn chuột phải
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    // Chặn phím tắt xem source / DevTools
    document.addEventListener('keydown', function(e) {
      // F12
      if (e.key === 'F12') { e.preventDefault(); return false; }
      // Ctrl+U (view source), Ctrl+Shift+I/J/C (DevTools), Ctrl+S
      if (e.ctrlKey && ['u','U','s','S'].includes(e.key)) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['i','I','j','J','c','C'].includes(e.key)) { e.preventDefault(); return false; }
    });
  </script>
</body>
</html>
