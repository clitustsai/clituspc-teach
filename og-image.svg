<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1a56db;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a56db;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#1a56db" opacity="0.2"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#lineGrad)"/>

  <!-- Logo icon -->
  <g transform="translate(100, 220)">
    <!-- C shape -->
    <path d="M55 10C30.1 10 10 30.1 10 55C10 79.9 30.1 100 55 100C63.5 100 71.4 97.6 78 93.3L68.5 83.8C64.2 86.7 59.8 88.4 55 88.4C36.8 88.4 22 73.2 22 55C22 36.8 36.8 22 55 22C59.8 22 64.2 23.7 68.5 26.2L78 16.7C71.4 12.4 63.5 10 55 10Z" fill="#1a56db"/>
    <!-- P shape -->
    <path d="M60 35H76C81.5 35 86 39.5 86 45V52C86 57.5 81.5 62 76 62H66V80H60V35ZM66 41V56H76C78.8 56 81 53.8 81 51V46C81 43.2 78.8 41 76 41H66Z" fill="#334155"/>
    <!-- Dots -->
    <rect x="88" y="18" width="8" height="8" fill="#1a56db"/>
    <rect x="100" y="18" width="8" height="8" fill="#475569"/>
    <rect x="88" y="30" width="8" height="8" fill="#1a56db"/>
    <rect x="100" y="30" width="8" height="8" fill="#1a56db"/>
  </g>

  <!-- Company name -->
  <text x="240" y="268" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="3">CLITUS PC</text>
  <text x="242" y="308" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#64748b" letter-spacing="2">Technology Company Limited</text>

  <!-- Divider -->
  <rect x="100" y="340" width="500" height="2" fill="url(#lineGrad)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="100" y="395" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3b82f6">Giải pháp công nghệ toàn diện</text>
  <text x="100" y="440" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Web · App · ERP · Cloud · AI · Hosting &amp; Server</text>

  <!-- Stats -->
  <g transform="translate(100, 490)">
    <rect width="140" height="70" rx="10" fill="#1a56db" opacity="0.15" stroke="#1a56db" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle">50+</text>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Dự án</text>
  </g>
  <g transform="translate(260, 490)">
    <rect width="140" height="70" rx="10" fill="#1a56db" opacity="0.15" stroke="#1a56db" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle">30+</text>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Khách hàng</text>
  </g>
  <g transform="translate(420, 490)">
    <rect width="140" height="70" rx="10" fill="#1a56db" opacity="0.15" stroke="#1a56db" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle">5+</text>
    <text x="70" y="52" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Năm KN</text>
  </g>

  <!-- Right side decoration -->
  <circle cx="950" cy="315" r="180" fill="none" stroke="#1a56db" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="950" cy="315" r="130" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="950" cy="315" r="80" fill="#1a56db" opacity="0.08"/>
  <!-- Tech icons text -->
  <text x="950" y="295" font-family="Arial, sans-serif" font-size="48" text-anchor="middle">💻</text>
  <text x="950" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3b82f6" text-anchor="middle">AI · Web · App</text>

  <!-- URL bottom right -->
  <text x="1100" y="600" font-family="Arial, sans-serif" font-size="18" fill="#475569" text-anchor="end">clituspc-tech.vercel.app</text>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1a56db" stroke-width="2" stroke-opacity="0.3" rx="0"/>
</svg>
