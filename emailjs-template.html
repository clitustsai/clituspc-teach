<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;">
  <div style="background:#1a56db;padding:20px 24px;border-radius:8px 8px 0 0;">
    <h2 style="color:#fff;margin:0;font-size:18px;">📩 Yêu cầu tư vấn mới</h2>
    <p style="color:rgba(255,255,255,0.8);margin:4px 0 0;font-size:12px;">Clitus PC Technology Company Limited</p>
  </div>
  <div style="background:#fff;padding:24px;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;">
    <table style="width:100%;border-collapse:collapse;">
      <tr><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;color:#64748b;width:120px;font-size:13px;">Họ và tên</td><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-weight:600;font-size:13px;">{{from_name}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;">Công ty</td><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">{{company}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;">Điện thoại</td><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">{{phone}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;">Email</td><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">{{reply_to}}</td></tr>
      <tr><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;">Dịch vụ</td><td style="padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px;">{{service}}</td></tr>
    </table>
    <div style="margin-top:16px;">
      <p style="color:#64748b;font-size:12px;margin-bottom:6px;">Mô tả dự án:</p>
      <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:12px;font-size:13px;color:#334155;">{{message}}</div>
    </div>
  </div>
</div>
