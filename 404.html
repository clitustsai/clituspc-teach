<!DOCTYPE html>
<html lang="vi">
<head>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a; color: #fff;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,86,219,0.2) 0%, transparent 70%);
    }
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(26,86,219,0.12) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .wrap {
      position: relative; z-index: 1;
      text-align: center; padding: 24px;
      max-width: 560px;
    }
    .code {
      font-size: clamp(100px, 20vw, 160px);
      font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #1a56db, #3b82f6, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg,#1a56db,#0e3a8a);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
    h1 { font-size: clamp(20px,4vw,28px); font-weight: 700; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: #1a56db; color: #fff; box-shadow: 0 4px 20px rgba(26,86,219,0.4); }
    .btn-primary:hover { background: #3b82f6; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.2); }
    .btn-outline:hover { border-color: #3b82f6; color: #3b82f6; }
    .suggestions {
      margin-top: 40px; padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .suggestions p { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
    .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: #3b82f6; font-size: 13px; text-decoration: none;
      padding: 6px 14px; border-radius: 6px;
      background: rgba(26,86,219,0.1);
      border: 1px solid rgba(26,86,219,0.2);
      transition: all 0.2s;
    }
    .links a:hover { background: rgba(26,86,219,0.25); }
  </style>
</head>
<body>
  <div class="bg"></div>

        </svg>
      </div>
      <span class="logo-text">CLITUS PC</span>
    </div>
    <div class="code">404</div>
    <h1>Trang không tồn tại</h1>
    <p>Trang bạn đang tìm kiếm có thể đã bị xóa, đổi tên hoặc tạm thời không khả dụng. Đừng lo — hãy quay về trang chủ để tiếp tục.</p>

    <div class="suggestions">

      <div class="links">
        <a href="/#services">Dịch vụ</a>
        <a href="/#projects">Dự án</a>
        <a href="/#blog">Blog</a>
        <a href="/#contact">Liên hệ</a>
        <a href="/#faq">FAQ</a>

    </div>
  </div>
</body>
</html>
